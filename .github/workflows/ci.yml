name: CI

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: "0 6 * * *"  # nightly: exercise the slow integration tier

# Cancel superseded runs on the same ref.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: NLM

jobs:
  # Fast tier: pure-Python suites that do NOT require torch/transformers.
  # Runs on every push across supported Python versions for quick signal.
  fast-tests:
    name: Fast tests (no torch)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install (light core + dev)
        run: pip install -e ".[dev]"
      - name: Run torch-free test tier
        run: |
          pytest -p no:cacheprovider \
            tests/test_config_schema.py \
            tests/test_eval_metrics.py \
            tests/test_eval_benchmark.py \
            tests/test_eval_runner.py \
            tests/test_data_validation.py

  # Full tier: installs the ML stack (CPU torch) and runs everything except the
  # slow end-to-end training tests.
  full-tests:
    name: Full tests (with torch)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install (ml + dev, CPU torch)
        run: |
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install -e ".[ml,dev]"
      - name: Run full suite (excluding slow)
        run: pytest -p no:cacheprovider -m "not slow"

  lint:
    name: Lint & type-check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install (dev)
        run: pip install -e ".[dev]"
      - name: Ruff
        run: ruff check nlm
      - name: Black (check)
        run: black --check nlm
      - name: Mypy
        run: mypy nlm || true  # advisory until annotations are complete

  validate-data:
    name: Validate training datasets
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install (light core)
        run: pip install -e .
      - name: Validate agent datasets
        working-directory: ${{ github.workspace }}
        run: nlm-validate-data --path data/agents/*.jsonl --min-samples 5

  # Slow end-to-end training tests: opt-in (manual or nightly) since they
  # download tiny models and run real training loops.
  slow-tests:
    name: Slow integration tests
    if: github.event_name == 'workflow_dispatch' || github.event_name == 'schedule'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install (ml + dev, CPU torch)
        run: |
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install -e ".[ml,dev]"
      - name: Run slow tests
        run: pytest -p no:cacheprovider -m "slow"
